[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pmcid-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented PubMed Central identifier claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
pmcid-validation-claim-audit = "pmcid_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["pmcid_validation_claim_audit*"]
